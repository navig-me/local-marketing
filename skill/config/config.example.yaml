# local-marketing config
# Generated by the init interview. This file is the source of truth that
# every agent script reads — do not rely on prose docs for facts agents need.

project:
  name: ""
  slug: ""              # used for the data directory name, e.g. ~/marketing/<slug>/
  website: ""
  one_line_description: ""
  data_dir: ""           # absolute path, default ~/marketing/<slug>/

icp:
  priority_geography: ""
  segments: []            # list of segment ids; each has a segments/<id>.yaml brief

smtp:
  provider: ""            # resend | elastic_email | mailersend | other
  host: ""
  port: 587
  username: ""
  password_env_var: "LOCAL_MARKETING_SMTP_PASSWORD"   # never store the secret itself in this file
  from_address: ""
  from_name: ""
  # optional REST API for bounce/complaint polling (used by circuit breaker + reply-triage)
  api_key_env_var: "LOCAL_MARKETING_SMTP_API_KEY"
  api_base_url: ""

reporting:
  admin_email: ""          # weekly report self-emailed here via the same SMTP pipe
  cadence: "weekly_monday"

safety:
  bounce_rate_threshold: 0.05
  complaint_rate_threshold: 0.001
  ramp_schedule: [5, 10, 15, 25]   # weekly new-prospect cap, weeks 1-4 of a new segment/domain
  cadence_days: [1, 4, 9, 15]      # sequence send-day offsets

review:
  pending_dir: "pending_review"
  approved_dir: "approved"

llm:
  # Headless CLI invoked for research/draft/triage. Must accept a prompt on
  # stdin and print text (JSON preferred) to stdout non-interactively.
  command: "claude"
  args: ["-p", "--output-format", "json"]
